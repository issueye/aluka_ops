  background: rgba(199, 204, 214, 0.3); border-radius: var(--radius-sm);
  width: fit-content;
}

.othertabs-item {
  padding: 2px 12px; border: none; border-radius: 2px; background: transparent;
  color: var(--color-text-2); font-size: var(--font-size-lead);
  font-weight: var(--font-weight-regular); line-height: var(--line-height-h4); cursor: pointer;
  transition: all 0.15s;
}

.othertabs-item:hover:not(.active):not(:disabled) { background: rgba(199, 204, 214, 0.2); }

.othertabs-item.active {
  background: var(--color-white); color: var(--primary-6); font-weight: var(--font-weight-medium);
  border-radius: var(--radius-sm);
  box-shadow: 0px 1px 2px 0px rgba(0,0,0,0.07), 0px 0.5px 1px 0px rgba(0,0,0,0.05), 0px 0px 0px 0.5px rgba(213,219,227,0.7);
}

.othertabs-item:disabled { opacity: 0.4; cursor: not-allowed; }



.tabs-wrapper {
  display: flex; align-items: center;
  justify-content: space-between; border-bottom: 1px solid var(--color-border-2);
}

.tabs-wrapper .tabs-line { border-bottom: none; flex: 1; }

.tabs-extra {
  display: flex; align-items: center;
  gap: var(--space-2); padding-right: 16px;
}

.tabs-extra .btn-extra {
  display: inline-flex; align-items: center; justify-content: center; height: 28px; padding: 0 12px;
  border: 1px solid var(--color-border-3); border-radius: var(--radius-sm);
  background: var(--color-white); color: var(--color-text-2); font-size: var(--font-size-lead);
  cursor: pointer; transition: all 150ms ease; gap: var(--space-1);
}

.tabs-extra .btn-extra:hover { border-color: var(--primary-6); color: var(--primary-6); }

.tabs-add-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
  border: 1px solid var(--color-border-3); border-radius: var(--radius-sm);
  background: var(--color-white); color: var(--color-text-2); font-size: var(--font-size-h3);
  cursor: pointer; transition: all 150ms ease; margin-left: var(--space-2);
}

.tabs-add-btn:hover { border-color: var(--primary-6); color: var(--primary-6); }

.tab-panel {
  padding: 16px 0; font-size: var(--font-size-lead);
  color: var(--color-text-2); line-height: var(--line-height-h4);
}

.tab-panel-bordered {
  border: 1px solid var(--color-border-2); border-top: none;
  padding: var(--space-4); border-radius: 0 0 4px 4px;
}



.icon-svg { width: 14px; height: 14px; fill: currentColor; }

/* ==========================================================================
   Tag
   ========================================================================== */
.status-tag {
  display: inline-flex; align-items: center; gap: var(--space-1); border: none;
  border-radius: var(--radius-sm); font-size: var(--font-size-body);
  line-height: var(--line-height-body); font-weight: var(--font-weight-medium); white-space: nowrap;
  box-sizing: border-box;
 
}

.status-tag-icon {
  flex-shrink: 0; width: 14px; height: 14px; display: inline-flex; align-items: center;
  justify-content: center;
}

.status-tag-icon svg { width: 14px; height: 14px; }
.status-tag-text { padding: 0; background: transparent; }
.status-tag-text.status-tag-success { color: var(--success-6); }
.status-tag-text.status-tag-warning { color: var(--warning-6); }
.status-tag-text.status-tag-processing { color: var(--primary-6); }
.status-tag-text.status-tag-stop { color: var(--color-text-2); }
.status-tag-text.status-tag-error { color: var(--danger-6); }
.status-tag-fill { padding: 0 6px; }
.status-tag-fill.status-tag-success { background: var(--success-2); color: var(--success-6); }
.status-tag-fill.status-tag-warning { background: var(--warning-2); color: var(--warning-6); }
.status-tag-fill.status-tag-processing { background: var(--primary-2); color: var(--primary-6); }
.status-tag-fill.status-tag-stop { background: var(--grey-3); color: var(--color-text-2); }
.status-tag-fill.status-tag-error { background: var(--danger-2); color: var(--danger-6); }

/* ==========================================================================
   Timepicker
   ========================================================================== */
.timepicker { display: inline-flex; align-items: center; position: relative; }

.timepicker-input {
  display: inline-flex; align-items: center; width: 100%; background: var(--color-white);
  border: 1px solid var(--color-border-3); border-radius: var(--radius-sm);
  font-weight: var(--font-weight-regular);
  cursor: pointer; transition: border-color 150ms ease, background-color 150ms ease;
}

.timepicker-lg .timepicker-input { height: 36px; padding: 0 12px; font-size: var(--font-size-h4); }
.timepicker-md .timepicker-input { height: 32px; padding: 0 12px; font-size: var(--font-size-lead); }
.timepicker-sm .timepicker-input { height: 28px; padding: 0 12px; font-size: var(--font-size-lead); }
.timepicker-value { color: var(--color-text-1); white-space: nowrap; }
.timepicker-placeholder { color: var(--color-text-3); white-space: nowrap; }
.timepicker-separator { color: var(--color-text-3); margin: 0 8px; }

.timepicker-suffix {
  display: inline-flex; align-items: center; margin-left: auto;
  padding-left: 8px; color: var(--color-text-3);
}
.timepicker.hover .timepicker-input,
.timepicker:hover:not(.focus):not(.disabled):not(.error) .timepicker-input { border-color: rgba(22, 100, 255, 0.8); }
.timepicker.focus .timepicker-input { border-color: var(--primary-6); box-shadow: 0 0 0 2px rgba(22, 100, 255, 0.1); }
.timepicker.error .timepicker-input { border-color: var(--danger-5); }

.timepicker.disabled .timepicker-input {
  background: var(--color-bg-4); border-color: var(--color-border-3);
  cursor: not-allowed;
}

.timepicker.disabled .timepicker-value { color: var(--text-yuanliNeutral-5); }
.timepicker.disabled .timepicker-placeholder { color: var(--text-yuanliNeutral-5); }
.timepicker.disabled .timepicker-suffix { color: var(--text-yuanliNeutral-5); }
.timepicker-range .timepicker-input { min-width: 240px; }

/* ==========================================================================
   Tooltip
   ========================================================================== */
.tooltip {
  display: inline-flex; position: relative; color: var(--color-white);
  font-size: var(--font-size-body); font-weight: var(--font-weight-regular);
  line-height: var(--line-height-body);
}

.tooltip-bubble {
  display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
  padding: 6px 8px; border-radius: var(--radius-sm); background: var(--grey-8);
  box-shadow: 0 5px 15px rgba(0,0,0,0.05), 0 15px 35px rgba(0,0,0,0.05); white-space: nowrap;
}

.tooltip-arrow-wrap { display: flex; padding: 0 12px; }
.tooltip-arrow-wrap-side { padding: 0; }
.tooltip-arrow { display: block; background: var(--grey-8); flex: none; }
.tooltip-arrow-top,
.tooltip-arrow-bottom { width: 12px; height: 6px; }
.tooltip-arrow-top { clip-path: polygon(50% 0, 0 100%, 100% 100%); }
.tooltip-arrow-bottom { clip-path: polygon(0 0, 100% 0, 50% 100%); }
.tooltip-arrow-left,
.tooltip-arrow-right { width: 6px; height: 12px; }
.tooltip-arrow-left { clip-path: polygon(0 50%, 100% 0, 100% 100%); }
.tooltip-arrow-right { clip-path: polygon(0 0, 100% 50%, 0 100%); }
.tooltip[data-placement="top"] { flex-direction: column; align-items: center; }
.tooltip[data-placement="top-left"] { flex-direction: column; align-items: flex-start; }
.tooltip[data-placement="top-right"] { flex-direction: column; align-items: flex-end; }
.tooltip[data-placement="bottom"] { flex-direction: column-reverse; align-items: center; }
.tooltip[data-placement="bottom-left"] { flex-direction: column-reverse; align-items: flex-start; }
.tooltip[data-placement="bottom-right"] { flex-direction: column-reverse; align-items: flex-end; }
.tooltip[data-placement="left"] { flex-direction: row; align-items: center; }
.tooltip[data-placement="right"] { flex-direction: row; align-items: center; }

/* ==========================================================================

   ========================================================================== */
.top-nav {
  height: 48px; background: var(--bg-white); display: flex; align-items: center;
  box-shadow: 0 2px 6px 0 rgba(0, 0, 0, 0.05); position: relative; z-index: 100; width: 100%;
  flex-shrink: 0;
}

.hamburger-btn {
  width: 48px; height: 48px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; cursor: pointer; flex-shrink: 0;
}

.hamburger-line {
  width: 16px; height: 2px;
  background: var(--text-2); border-radius: 1px;
}

.nav-logo { width: 103px; height: 24px; flex-shrink: 0; }
.nav-logo svg { width: 100%; height: 100%; }

.product-tabs {
  display: flex; align-items: center; margin-left: var(--space-8); padding-left: 24px;
  gap: var(--space-6); height: 100%;
}

.product-tab {
  font-size: var(--font-size-lead); color: var(--text-2); cursor: pointer; height: 100%;
  display: flex; align-items: center; position: relative; white-space: nowrap;
  font-weight: var(--font-weight-regular);
}

.product-tab:hover { color: var(--text-1); }
.product-tab.active { color: var(--text-1); font-weight: var(--font-weight-medium); }

.product-tab.active::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: var(--primary-6);
}

.nav-right {
  margin-left: auto; display: flex; align-items: center;
  gap: var(--space-4); padding-right: 16px;
}

.search-box {
  display: flex; align-items: center; gap: 6px; padding: 6px 12px;
  border: 1px solid var(--border-1); border-radius: var(--radius-sm); background: var(--bg-4);
}

.search-input {
  border: none; outline: none; background: transparent; font-size: var(--font-size-lead);
  color: var(--text-1); width: 180px; font-family: inherit; font-weight: var(--font-weight-regular);
}

.search-input::placeholder { color: var(--text-3); }
.nav-links { display: flex; align-items: center; gap: var(--space-4); }

.nav-link {
  font-size: var(--font-size-lead); color: var(--text-1); cursor: pointer;
  white-space: nowrap; font-weight: var(--font-weight-regular);
}

.nav-link:hover { color: var(--primary-6); }

.nav-icon {
  width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative;
}

.nav-icon svg { width: 16px; height: 16px; }

.notification-dot {
  position: absolute; top: -2px; right: -2px; width: 6px; height: 6px;
  background: var(--color-danger); border-radius: 50%;
}

.nav-avatar {
  width: 28px; height: 28px; border-radius: 50%; background: var(--danger-2);
  color: var(--danger-7); font-size: 15px; font-weight: 700; display: flex; align-items: center;
  justify-content: center; cursor: pointer; flex-shrink: 0;
}

      <style>
/* Login page split layout */
.login-page {
  min-height: 100vh;
  display: flex;
  align-items: stretch;
  background: var(--color-bg-1);
  overflow: hidden;
}

/* Left illustration panel */
.login-left {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  background: linear-gradient(135deg, var(--primary-yuanliBlue-2) 0%, var(--primary-yuanliBlue-1) 50%, var(--color-bg-4) 100%);
  position: relative;
  overflow: hidden;
  padding: 48px;
}

/* Decorative shapes on left panel */
.login-bg-shape {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.12;
}
.login-bg-shape-1 {
  width: 400px; height: 400px;
  background: var(--primary-6);
  top: -100px; right: -100px;
}
.login-bg-shape-2 {
  width: 300px; height: 300px;
  background: var(--teal-6);
  bottom: -50px; left: -50px;
}

.login-illustration {
  position: relative;
  z-index: 1;
  max-width: 400px;
  width: 100%;
}
.login-illustration svg {
  width: 100%;
  height: auto;
}

.login-left-text {
  position: relative;
  z-index: 1;
  text-align: center;
}
.login-left-text h2 {
  font-size: var(--font-size-h1, 20px);
  font-weight: var(--font-weight-semibold, 600);
  color: var(--text-1);
  margin-bottom: 8px;
}
.login-left-text p {
  font-size: var(--font-size-lead, 13px);
  color: var(--text-2);
}

/* Right form panel */
.login-right {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
}

@media (max-width: 900px) {
  .login-page { flex-direction: column; }
  .login-left { display: none; }
  .login-right { flex: 1; }
}

/* Login card */
.login-card {
  position: relative;
  width: 400px;
  max-width: 90vw;
  background: var(--color-bg-1);
  border-radius: var(--radius-lg, 12px);
  box-shadow: 0 8px 24px 0 rgba(0,0,0,0.08), 0 2px 6px 0 rgba(0,0,0,0.04);
  padding: 40px 36px;
  z-index: 1;
}

/* Logo */
.login-logo {
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}
.login-logo svg {
  width: 120px;
  height: 28px;
}

/* Title and subtitle */
.login-title {
  text-align: center;
  font-size: var(--font-size-h1, 20px);
  font-weight: var(--font-weight-medium, 500);
  color: var(--text-1);
  line-height: var(--line-height-h1, 28px);
  margin-bottom: 8px;
}
.login-subtitle {
  text-align: center;
  font-size: var(--font-size-lead, 13px);
  color: var(--text-3);
  line-height: var(--line-height-h4, 22px);
  margin-bottom: 32px;
}

/* Form */
.login-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.login-form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.login-form-label {
  font-size: var(--font-size-lead, 13px);
  color: var(--text-2);
  font-weight: var(--font-weight-medium, 500);
  line-height: var(--line-height-h4, 22px);
}

/* Input wrapper */
.login-input-wrapper {
  display: flex;
  align-items: center;
  height: 40px;
  border: 1px solid var(--border-3);
  border-radius: var(--radius-sm, 4px);
  background: var(--color-bg-1);
  transition: border-color 0.15s, box-shadow 0.15s;
  overflow: hidden;
}
.login-input-wrapper:focus-within {
  border-color: var(--primary-6);
  box-shadow: 0 0 0 3px rgba(22, 100, 255, 0.3);
}
.login-input-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  color: var(--text-3);
}
.login-input-icon svg {
  width: 16px;
  height: 16px;
}
.login-input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-size: var(--font-size-lead, 13px);
  color: var(--text-1);
  font-family: inherit;
  height: 40px;
  padding-right: 12px;
}
.login-input::placeholder {
  color: var(--text-3);
}

/* Password toggle */
.login-password-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  cursor: pointer;
  color: var(--text-3);
  transition: color 0.15s;
}
.login-password-toggle:hover {
  color: var(--text-1);
}
.login-password-toggle svg {
  width: 16px;
  height: 16px;
}

/* Remember + forgot row */
.login-options-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 4px;
}

/* Custom checkbox */
.login-checkbox {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: var(--font-size-lead, 13px);
  color: var(--text-2);
  user-select: none;
}
.login-checkbox-box {
  width: 14px;
  height: 14px;
  border: 1px solid var(--border-3);
  border-radius: 2px;
  background: var(--color-bg-1);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}
.login-checkbox.checked .login-checkbox-box {
  background: var(--primary-6);
  border-color: var(--primary-6);
}
.login-checkbox.checked .login-checkbox-box svg {
  display: block;
}
.login-checkbox-box svg {
  width: 10px;
  height: 10px;
  display: none;
  color: white;
}

/* Forgot password link */
.login-forgot-link {
  font-size: var(--font-size-lead, 13px);
  color: var(--primary-6);
  text-decoration: none;
  cursor: pointer;
  transition: color 0.15s;
}
.login-forgot-link:hover {
  color: var(--primary-7);
}

/* Login button */
.login-submit-btn {
  height: 40px;
  border: none;
  border-radius: var(--radius-sm, 4px);
  background: var(--primary-6);
  color: white;
  font-size: var(--font-size-lead, 13px);
  font-weight: var(--font-weight-medium, 500);
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 8px;
}
.login-submit-btn:hover {
  background: var(--primary-7);
}
.login-submit-btn:active {
  transform: scale(0.99);
}

/* Divider */
.login-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
}
.login-divider-line {
  flex: 1;
  height: 1px;
  background: var(--border-2);
}
.login-divider-text {
  font-size: var(--font-size-body, 12px);
  color: var(--text-3);
  white-space: nowrap;
}

/* Footer */
.login-footer {
  text-align: center;
  margin-top: 24px;
  font-size: var(--font-size-body, 12px);
  color: var(--text-3);
  line-height: 1.6;
}
.login-footer a {
  color: var(--primary-6);
  text-decoration: none;
}

/* Error message (hidden by default) */
.login-error {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: var(--radius-sm, 4px);
  background: var(--danger-2);
  border: 1px solid var(--danger-3);
  font-size: var(--font-size-body, 12px);
  color: var(--danger-7);
}
.login-error svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

          <!-- Title -->
          <h1 class="login-title">Aluka Ops</h1>
          <p class="login-subtitle">服务治理面板</p>

          <!-- Form -->
          <form class="login-form" onsubmit="return false;">
            <!-- Error message (hidden) -->
            <div class="login-error" id="login-error">
              <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="7" cy="7" r="6"/>
                <path d="M7 4v3M7 9.5v0.5" stroke-linecap="round"/>
              </svg>
              <span>用户名或密码错误，请重新输入</span>
            </div>

            <!-- Username -->
            <div class="login-form-group">
              <label class="login-form-label">用户名</label>
              <div class="login-input-wrapper">
                <div class="login-input-icon">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="8" cy="5" r="3"/>
                    <path d="M2.5 14c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke-linecap="round"/>
                  </svg>
                </div>
                <input class="login-input" type="text" placeholder="请输入用户名" value="admin" autocomplete="username">
              </div>
            </div>

            <!-- Password -->
            <div class="login-form-group">
              <label class="login-form-label">密码</label>
              <div class="login-input-wrapper">
                <div class="login-input-icon">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="7" width="10" height="7" rx="1"/>
                    <path d="M5 7V5a3 3 0 016 0v2" stroke-linecap="round"/>
                  </svg>
                </div>
                <input class="login-input" type="password" placeholder="请输入密码" value="123456" autocomplete="current-password">
                <div class="login-password-toggle">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke-linecap="round"/>
                    <circle cx="8" cy="8" r="2"/>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Remember + Forgot -->
            <div class="login-options-row">
              <label class="login-checkbox checked">
                <span class="login-checkbox-box">
                  <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M2 5l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </span>
                记住我
              </label>
              <a class="login-forgot-link">忘记密码？</a>
            </div>

            <!-- Login Button -->
            <button class="login-submit-btn" data-dom-id="login-submit" type="submit">
              登录
            </button>
          </form>

          <!-- Divider -->
          <div class="login-divider">
            <div class="login-divider-line"></div>
            <span class="login-divider-text">其他登录方式</span>
            <div class="login-divider-line"></div>
          </div>

          <!-- Footer -->
          <div class="login-footer">
            Aluka Ops v1.2.0 · 单机独立节点<br>
            © 2024 Aluka Ops · 服务治理面板
          </div>
        </div>
        </div>
      </div>
